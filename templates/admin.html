{% extends "base.html" %}

{% block title %}Manage Devices | EMS Dashboard{% endblock %}

{% block content %}
<div class="navbar">
    <div class="nav-left">
        <a href="/" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 18px;">
            <img src="{{ url_for('static', filename='images/image.png') }}" alt="Company Logo" class="company-logo">
            <div class="nav-titles">
                <h1 id="dashboardTitle">Device Manager</h1>
                <p class="subtitle">FUSO Energy Monitoring System</p>
            </div>
        </a>
    </div>
    <div class="nav-right">
        <button id="logoutBtn" class="theme-btn" title="Logout" style="color: #ef4444;">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        </button>
        <button id="themeToggle" class="theme-btn" title="Toggle Light/Dark Mode">
            <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
        </button>
    </div>
</div>

<div class="container" style="padding-top: 30px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
        <h2>Configured Plants & Devices</h2>
        <button id="createPlantBtn" class="submit-btn" style="width: auto; padding: 10px 20px;" onclick="openPlantModal()">+ Create Plant</button>
    </div>

    <div id="plantsContainer" style="display: flex; flex-direction: column; gap: 24px;">
        <!-- Filled by JS -->
    </div>
</div>

<!-- DEVICE MANAGER MODAL -->
<div id="deviceManagerModal" class="modal-overlay" style="display: none;">
    <div class="modal-content device-modal">
        <div class="modal-header">
            <h2 id="deviceModalTitle">Add Device</h2>
            <button type="button" class="close-modal-btn" onclick="closeDeviceModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="deviceForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>Plant Name</label>
                        <select id="devPlant" required>
                            <option value="" disabled selected>Select a Plant...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Meter ID</label>
                        <input type="number" id="devMeterId" required placeholder="e.g. 8">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Meter Name</label>
                        <input type="text" id="devName" required placeholder="e.g. Top Furnace">
                    </div>
                    <div class="form-group">
                        <label>Type</label>
                        <select id="devType">
                            <option value="submeter">Submeter</option>
                            <option value="incomer">Main Incomer</option>
                        </select>
                    </div>
                </div>
                <p id="devError" style="color: #ef4444; display: none; font-size: 0.9em;"></p>
                <button type="submit" class="submit-btn" style="width: 100%;">Save Device</button>
            </form>
        </div>
    </div>
</div>

<!-- PLANT CREATION MODAL -->
<div id="plantModal" class="modal-overlay" style="display: none;">
    <div class="modal-content device-modal" style="max-width: 500px;">
        <div class="modal-header">
            <h2>Create New Plant</h2>
            <button type="button" class="close-modal-btn" onclick="closePlantModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="plantForm">
                <div class="form-group">
                    <label>Plant Name</label>
                    <input type="text" id="newPlantName" required placeholder="e.g. Factory Block B">
                </div>
                <div id="plantError" style="color: #ef4444; margin-bottom: 15px; font-size: 0.9em;"></div>
                <button type="submit" class="submit-btn" style="width: 100%;">Create Plant</button>
            </form>
        </div>
    </div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/admin.js') }}"></script>
{% endblock %}
