{% extends "admin_layout.html" %}
{% set active_page = 'reports' %}

{% block page_title %}Reports{% endblock %}

{% block admin_content %}
<div class="admin-page-shell">
    <div class="admin-page-header">
        <div class="admin-page-header-text">
            <h2 class="admin-page-title">Energy Reports</h2>
            <p class="admin-page-subtitle">Generate PDF consumption reports by plant and date range</p>
        </div>
    </div>

    <div class="admin-panel" style="max-width: 560px; margin: 0 auto;">
        <div class="admin-panel-header">
            <h3>Download PDF Report</h3>
        </div>
        <div class="admin-panel-body">
            <form action="/api/reports/download" method="GET" id="reportForm">
                <div class="form-group">
                    <label for="plantSelect">Plant</label>
                    <select name="plant" id="plantSelect" required>
                        <option value="" disabled selected>Loading plants...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" name="start_date" id="startDate" required>
                </div>
                <div class="form-group">
                    <label for="endDate">End Date</label>
                    <input type="date" name="end_date" id="endDate" required>
                </div>
                <button type="submit" class="submit-btn" style="width:100%;">Download PDF</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block admin_scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    fetch('/plants')
        .then(res => res.json())
        .then(plants => {
            const select = document.getElementById("plantSelect");
            select.innerHTML = '<option value="" disabled selected>Select a Plant...</option>';
            plants.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p;
                opt.textContent = p;
                select.appendChild(opt);
            });
        })
        .catch(err => console.error("Error fetching plants:", err));

    document.getElementById("reportForm").addEventListener("submit", () => {
        skipLoader = true;
        setTimeout(() => skipLoader = false, 2000);
    });
});
</script>
{% endblock %}
