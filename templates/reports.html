{% extends "admin_layout.html" %}
{% set active_page = 'reports' %}

{% block page_title %}Reports{% endblock %}

{% block admin_head %}
<style>
.reports-container {
    max-width: 600px;
    margin: 60px auto;
    background: var(--card-bg);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 25px var(--shadow);
    border: 1px solid var(--border-color);
}
.reports-container h2 {
    margin-top: 0;
    margin-bottom: 20px;
    font-size: 1.5rem;
    background: linear-gradient(135deg, #34d399, #10b981);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.form-group {
    margin-bottom: 20px;
}
.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 500;
    color: var(--text-sub);
}
.form-group select, .form-group input {
    width: 100%;
    padding: 10px;
    background: rgba(0, 0, 0, 0.2);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    color: var(--text-main);
    font-family: inherit;
    font-size: 1rem;
}
.light-mode .form-group select, .light-mode .form-group input {
    background: rgba(255, 255, 255, 0.8);
}
.submit-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #10b981, #059669);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
}
.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
}
</style>
{% endblock %}

{% block admin_content %}
<div style="padding: 40px 20px; display: flex; justify-content: center; align-items: flex-start; flex: 1;">
    <div class="reports-container" style="margin: 0; width: 100%; max-width: 600px;">
        <h2>Generate PDF Report</h2>
    <form action="/api/reports/download" method="GET" id="reportForm">
        <div class="form-group">
            <label for="plantSelect">Select Plant</label>
            <select name="plant" id="plantSelect" required>
                <option value="" disabled selected>Loading plants...</option>
            </select>
        </div>
        <div class="form-group">
            <label for="startDate">Start Date</label>
            <input type="date" name="start_date" id="startDate" required>
        </div>
        <div class="form-group">
            <label for="endDate">End Date</label>
            <input type="date" name="end_date" id="endDate" required>
        </div>
        <button type="submit" class="submit-btn">Download PDF Report</button>
    </form>
    </div>
</div>
{% endblock %}

{% block admin_scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {
    // Fetch plants to populate dropdown
    fetch('/plants')
        .then(res => res.json())
        .then(plants => {
            const select = document.getElementById("plantSelect");
            select.innerHTML = '<option value="" disabled selected>Select a Plant...</option>';
            plants.forEach(p => {
                const opt = document.createElement("option");
                opt.value = p;
                opt.textContent = p;
                select.appendChild(opt);
            });
        })
        .catch(err => console.error("Error fetching plants:", err));

    // Prevent loader from getting stuck during file download
    document.getElementById("reportForm").addEventListener("submit", () => {
        skipLoader = true;
        setTimeout(() => skipLoader = false, 2000);
    });
});
</script>
{% endblock %}
