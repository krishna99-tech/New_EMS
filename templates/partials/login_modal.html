<div id="loginModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 400px;">
        <div class="modal-header">
            <h2>Staff Login</h2>
            <button type="button" class="close-modal-btn" onclick="closeLoginModal()">×</button>
        </div>
        <div class="modal-body">
            <form id="loginForm">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label for="loginUsername">Username</label>
                    <input id="loginUsername" type="text" class="form-control" placeholder="Enter username" autocomplete="username" required />
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required />
                </div>
                <p id="loginError" class="inline-note" style="display:none; color: var(--danger);">Invalid username or password.</p>
                <button type="submit" class="submit-btn" style="width:100%; margin-top: 8px;">Login</button>
            </form>
        </div>
    </div>
</div>
