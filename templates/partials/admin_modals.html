<div id="deviceManagerModal" class="modal-overlay" style="display: none;">
    <div class="modal-content device-modal">
        <div class="modal-header">
            <h2 id="deviceModalTitle">Add Device</h2>
            <button type="button" class="close-modal-btn" onclick="closeDeviceModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="deviceForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="devPlant">Plant Name</label>
                        <select id="devPlant" required><option value="" disabled selected>Select a Plant…</option></select>
                    </div>
                    <div class="form-group">
                        <label for="devMeterId">Meter ID</label>
                        <input type="number" id="devMeterId" required placeholder="e.g. 8">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="devName">Meter Name</label>
                        <input type="text" id="devName" required placeholder="e.g. Top Furnace">
                    </div>
                    <div class="form-group">
                        <label for="devType">Type</label>
                        <select id="devType">
                            <option value="submeter">Submeter</option>
                            <option value="incomer">Main Incomer</option>
                        </select>
                    </div>
                </div>
                <p id="devError" style="display: none;"></p>
                <button type="submit" class="submit-btn" style="width: 100%; margin-top: 8px; background: #4f46e5; color: #fff;">Save Device</button>
            </form>
        </div>
    </div>
</div>

<div id="plantModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 480px;">
        <div class="modal-header">
            <h2>Create New Plant</h2>
            <button type="button" class="close-modal-btn" onclick="closePlantModal()">&times;</button>
        </div>
        <div class="modal-body">
            <form id="plantForm">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label for="newPlantName">Plant Name</label>
                    <input type="text" id="newPlantName" required placeholder="e.g. Factory Block B">
                </div>
                <div id="plantError" style="margin-bottom: 12px;"></div>
                <button type="submit" class="submit-btn" style="width: 100%; background: #4f46e5; color: #fff;">Create Plant</button>
            </form>
        </div>
    </div>
</div>

<div id="registerDeviceModal" class="modal-overlay" style="display: none;">
    <div class="modal-content" style="max-width: 480px;">
        <div class="modal-header">
            <h2>Register Device</h2>
            <button type="button" class="close-modal-btn" onclick="closeRegisterDeviceModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div id="registerDevicePreview" class="device-preview-box"></div>
            <form id="registerDeviceForm">
                <input type="hidden" id="regDeviceId">
                <div class="form-group" style="margin-bottom: 14px;">
                    <label for="regPlantSelect">Assign to Plant</label>
                    <select id="regPlantSelect" required><option value="" disabled selected>Select a Plant…</option></select>
                </div>
                <div class="form-group" style="margin-bottom: 14px;">
                    <label for="regDeviceLabel">Device Label <span class="text-muted">(optional)</span></label>
                    <input type="text" id="regDeviceLabel" placeholder="e.g. Architecture Gateway">
                </div>
                <p id="regDeviceError" class="form-error" style="display:none;"></p>
                <button type="submit" class="submit-btn" style="width: 100%; background: #4f46e5; color: #fff;">Save Mapping</button>
            </form>
        </div>
    </div>
</div>

<!-- Custom Confirmation Modal Card -->
<div id="customConfirmModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px); z-index: 3500; justify-content: center; align-items: center;">
    <div class="modal-content" style="background: var(--dj-bg); color: var(--dj-text); border: 1px solid var(--dj-border); border-radius: 12px; max-width: 480px; width: 90%; box-shadow: 0 12px 32px rgba(0,0,0,0.35); overflow: hidden; padding: 0;">
        <div style="background: var(--dj-bg-sub); padding: 16px 20px; border-bottom: 1px solid var(--dj-border); display: flex; align-items: center; justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 10px;">
                <span id="confirmModalIcon" style="font-size: 1.4rem;">⚠️</span>
                <h3 id="confirmModalTitle" style="margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--dj-text);">Confirm Action</h3>
            </div>
            <button type="button" onclick="closeCustomConfirmModal()" style="background: transparent; border: none; font-size: 1.4rem; color: var(--dj-text-sub); cursor: pointer;">&times;</button>
        </div>
        <div style="padding: 20px;">
            <p id="confirmModalMessage" style="margin: 0 0 8px 0; font-size: 0.98rem; font-weight: 600; color: var(--dj-text);"></p>
            <p id="confirmModalSubmessage" style="margin: 0 0 16px 0; font-size: 0.85rem; color: var(--dj-text-sub); line-height: 1.4;"></p>
            
            <div id="confirmDataCheckContainer" style="display: none; background: rgba(220, 38, 38, 0.08); border: 1px solid rgba(220, 38, 38, 0.25); border-radius: 6px; padding: 12px; margin-bottom: 16px;">
                <label style="display: flex; align-items: flex-start; gap: 10px; cursor: pointer; font-size: 0.85rem; color: var(--dj-text);">
                    <input type="checkbox" id="confirmDeleteDataCheckbox" style="margin-top: 2px; accent-color: var(--dj-danger);">
                    <span id="confirmCheckboxLabel" style="font-weight: 500;">Also permanently delete all recorded sensor data (kWh readings & history)</span>
                </label>
            </div>
            
            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
                <button type="button" onclick="closeCustomConfirmModal()" style="padding: 8px 16px; background: var(--dj-bg-sub); color: var(--dj-text); border: 1px solid var(--dj-border); border-radius: 6px; font-weight: 600; cursor: pointer;">Cancel</button>
                <button type="button" id="confirmActionBtn" style="padding: 8px 18px; background: #dc2626; color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">Delete Permanently</button>
            </div>
        </div>
    </div>
</div>
