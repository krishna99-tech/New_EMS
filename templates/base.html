<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EMS Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/font.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', path='css/ems-core.css') }}?v=4">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=14">
    {% block head_extra %}{% endblock %}
</head>

<body>
    <!-- Sleek Non-Blocking Top Progress Bar (YouTube/GitHub Style) -->
    <div id="globalTopProgressBar" class="global-top-progress"></div>

    {% block content %}
    {% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <script src="{{ url_for('static', path='js/ems-shell.js') }}?v=6"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
