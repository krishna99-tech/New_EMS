<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}EMS Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/font.css') }}?v=3">
    <link rel="stylesheet" href="{{ url_for('static', path='css/ems-core.css') }}?v=4">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=11">
    {% block head_extra %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}

    <!-- Global Page Loader Overlay -->
    <div id="globalLoader" class="global-loader">
        <div class="loader-spinner"></div>
    </div>

    <!-- Global Loader Script moved to ems-shell.js -->

    <script src="{{ url_for('static', path='js/ems-shell.js') }}?v=4"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
