version: "3.8"

services:
  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: ems_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-ems_db}
    volumes:
      - ems_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ems_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── EMS Fuso Application (Web UI + UDP Ingestion) ───────────────────────────
  ems-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ems_fuso_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-ems_db}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-password123}
      SESSION_SECRET: ${SESSION_SECRET:-d350bf03cf87c736e4ec666a83615b6e9235987dfb716e3765fc0b2de71c27be}
      UDP_IP: "0.0.0.0"
      UDP_PORT: "10011"
      OFFLINE_THRESHOLD_SECONDS: "300"
    ports:
      # HTTP Web Dashboard & REST API
      - "${APP_PORT:-10012}:10012"
      # CRITICAL: /udp is required for ESP32 Modbus gateway packets!
      - "10011:10011/udp"

volumes:
  ems_pgdata:
    name: ems_pgdata
